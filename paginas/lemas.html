    <!-- Sin pie de página: la vitrina ocupa toda la pantalla -->
    <main id="contenido">
      <!-- ===== Vitrina de lemas · lemas.js la arma desde LEMAS =====
           Pantalla completa: la foto del lema tiñe el fondo; a la
           izquierda el título, la descripción y "Leer el lema", con el
           anterior y el siguiente asomando en tenue; a la derecha la
           tira de tarjetas (el año sobre la foto y la cita bíblica);
           abajo las flechas y el contador. Las animaciones son de GSAP
           (js/vendor/gsap.min.js); sin él, todo cambia sin animar. -->
      <section class="vitrina" id="vitrinaLemas" aria-roledescription="carrusel"
               aria-label="Lemas de cada año">
        <div class="vitrina__fondo" id="vitrinaFondo" aria-hidden="true">
          <div class="vitrina__capa"></div>
          <div class="vitrina__capa"></div>
        </div>
        <div class="vitrina__velo" aria-hidden="true"></div>

        <!-- Riel de la izquierda: un punto por lema sobre la línea; el
             elegido muestra su número. Abajo, "03 / 10" -->
        <nav class="vitrina__riel" aria-label="Elegir lema">
          <ol class="vitrina__puntos" id="vitrinaPuntos"></ol>
          <span class="vitrina__riel-txt" id="vitrinaRielTxt" aria-hidden="true">01 / 01</span>
        </nav>

        <div class="vitrina__interior">
          <div class="vitrina__texto">
            <button class="vitrina__fantasma vitrina__fantasma--arriba" id="vitrinaFantasmaArriba" type="button"></button>

            <div class="vitrina__principal" id="vitrinaPrincipal" aria-live="polite">
              <p class="vitrina__eyebrow" id="vitrinaEyebrow"></p>
              <h1 class="vitrina__titulo"><span id="vitrinaTitulo"></span></h1>
              <!-- Solo el lema: el título y su versículo completo, con la
                   referencia en <cite> -->
              <div class="vitrina__verso" id="vitrinaVerso"></div>
            </div>

            <button class="vitrina__fantasma vitrina__fantasma--abajo" id="vitrinaFantasmaAbajo" type="button"></button>
          </div>

          <div class="vitrina__lado">
            <div class="vitrina__ventana">
              <div class="vitrina__tira" id="vitrinaTira"></div>
            </div>

            <div class="vitrina__controles">
              <div class="vitrina__flechas">
                <button class="vitrina__flecha" id="vitrinaPrev" type="button" aria-label="Lema anterior">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <button class="vitrina__flecha" id="vitrinaNext" type="button" aria-label="Lema siguiente">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
                </button>
              </div>
              <p class="vitrina__contador">
                <span class="vitrina__contador-actual" id="vitrinaActual">01</span>
                <span class="vitrina__contador-linea" aria-hidden="true"><i id="vitrinaProgreso"></i></span>
                <span id="vitrinaTotal">01</span>
              </p>
            </div>
          </div>
        </div>
      </section>

    </main>
