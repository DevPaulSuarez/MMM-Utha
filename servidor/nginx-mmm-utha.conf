# ============================================================
# MMM · Backend en el VPS (Nginx + PHP-FPM 8.3)
#
#   sudo cp nginx-mmm-utha.conf /etc/nginx/sites-available/mmm-utha
#   sudo ln -s /etc/nginx/sites-available/mmm-utha /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mmm.devpess.com
#
# certbot agrega el https al archivo instalado. Si después se vuelve a
# copiar este archivo encima, correr otra vez:
#   sudo certbot --nginx -d mmm.devpess.com --reinstall --redirect
#
# Nginx no lee los .htaccess de api/ y subidas/: sus reglas están
# aquí. Si se agrega un archivo interno a api/, se agrega también en
# la primera "location" de abajo.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name mmm.devpess.com;

    root /var/www/mmm-utha;
    charset utf-8;

    # Fotos de hasta 5 MB desde la app: Nginx acepta 1 MB si no se dice
    client_max_body_size 8m;

    # Archivos internos de la API: se incluyen desde PHP o se usan desde
    # la terminal, nunca por web. Las "location" con ~ se revisan en
    # orden: estas tienen que ir antes que la que ejecuta PHP.
    location ~ ^/api/(config|config\.ejemplo|conexion|secciones|crear-usuario|migrar)\.php$ { return 404; }
    location ~ ^/api/.*\.(sql|md)$ { return 404; }
    location ~ /\. { return 404; }
    location ^~ /api/migraciones/ { return 404; }

    # Los endpoints de la API
    location ~ ^/api/[a-z-]+\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        # PHP trae 2 MB por foto. Se sube solo aquí, sin tocar el php.ini
        # que usan los otros sitios del VPS
        fastcgi_param PHP_VALUE "upload_max_filesize=6M
post_max_size=8M";
    }

    # Fotos que sube la app: solo se sirven, nada se ejecuta. Con ^~ no
    # se revisan las "location" de arriba: los ocultos se bloquean aquí
    location ^~ /subidas/ {
        location ~ (/\.|\.(php\d?|phtml|phar|pl|py|cgi|sh|shtml)$) { return 404; }
        expires 7d;
    }

    location ^~ /img/ {
        location ~ /\. { return 404; }
        expires 7d;
    }

    # Todo lo demás: el archivo si existe, y sin listar carpetas
    location / {
        try_files $uri =404;
    }
}
